name: Crawl

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl clien
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=clien&src=gha"
      - name: Crawl ppomppu
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=ppomppu&src=gha"
      - name: Crawl bobaedream
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=bobaedream&src=gha"
      - name: Crawl cook82
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=cook82&src=gha"
      - name: Crawl inven
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=inven&src=gha"
      # 오늘의유머는 해외 IP를 403으로 차단해서 이 경로로는 성공할 수 없다.
      # 맥미니(한국 홈 IP) launchd에서만 수집한다 — 상세는 workers/crawler/src/index.ts 주석 참고.
      - name: Crawl ddanzi
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=ddanzi&src=gha"
      - name: Crawl humoruniv
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=humoruniv&src=gha"
      - name: Crawl etoland
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=etoland&src=gha"
      - name: Crawl mlbpark
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=mlbpark&src=gha"
      # SLR클럽은 데이터센터 IP를 차단해서(Workers/GH Actions 모두 404/521) 이
      # 경로로는 성공할 수 없다. 맥미니(한국 홈 IP) launchd에서만 수집한다 —
      # 상세는 AGENTS.md 함정 6-3 참고.
      - name: Crawl damoang
        continue-on-error: true
        run: curl -sf "https://pickchive-crawler.won0209.workers.dev/crawl?site=damoang&src=gha"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright & dependencies
        run: |
          npm install playwright tsx
          npx playwright install chromium --with-deps

      - name: Crawl protected sites (ruliweb, damoang) via Playwright
        continue-on-error: true
        run: npx tsx scripts/crawl_protected.ts



